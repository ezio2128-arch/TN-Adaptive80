name: FramePulse Windows build
on:
  workflow_dispatch:
  push:
    branches: [claude/dazzling-sagan-e9y630]
    paths: ['FramePulse/**', '.github/workflows/framepulse-windows.yml']
defaults:
  run:
    working-directory: FramePulse
jobs:
  native:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: PresentMon CLI diagnostics
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 3
        run: |
          .\ThirdParty\PresentMon.exe --help 2>&1 | Out-String | Write-Host
          $p = Start-Process .\ThirdParty\PresentMon.exe -ArgumentList '--process_id 4 --output_stdout --no_console_stats --qpc_time_ms --no_track_input --terminate_on_proc_exit --session_name FramePulse.diag' -RedirectStandardOutput diag.out -RedirectStandardError diag.err -PassThru -NoNewWindow
          Start-Sleep 8
          Write-Host "exited=$($p.HasExited) code=$(if($p.HasExited){$p.ExitCode})"
          if (!$p.HasExited) { Stop-Process $p -Force }
          Write-Host '--- stdout'; Get-Content diag.out -TotalCount 10 -ErrorAction SilentlyContinue
          Write-Host '--- stderr'; Get-Content diag.err -TotalCount 15 -ErrorAction SilentlyContinue
      - name: Build native code and tests
        shell: pwsh
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FramePulse-native
          path: FramePulse/build/**/Release/*
  sln:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build, test and sign with an ephemeral development certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=FramePulse Development' -KeyUsage DigitalSignature -FriendlyName 'FramePulse development' -CertStoreLocation 'Cert:\CurrentUser\My' -NotAfter (Get-Date).AddYears(2) -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3','2.5.29.19={text}')
          New-Item out\release -ItemType Directory -Force | Out-Null
          Export-Certificate -Cert $cert -FilePath out\release\FramePulse-dev.cer | Out-Null
          Import-Certificate -FilePath out\release\FramePulse-dev.cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath out\release\FramePulse-dev.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          .\Installer\Build.ps1 -CertificateThumbprint $cert.Thumbprint
          Copy-Item out\FramePulse_1.0.0_candidate.msix out\release\
          Copy-Item out\packages\**\Dependencies\x64\*.appx out\release\ -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FramePulse-installable
          path: FramePulse/out/release/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FramePulse-solution
          path: FramePulse/out/**
