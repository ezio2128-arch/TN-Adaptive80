name: Bottled Phase 1 - Seasonal Snow Policy

on:
  push:
    branches: ["bottled-phase1/seasonal-snow-controller"]
    paths:
      - "bottled-phase1/**"
      - ".github/workflows/bottled-seasonal-snow-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile seasonal policy tests (no Skyrim DLL)
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic \
            bottled-phase1/tests/SeasonalSnowPolicyTests.cpp \
            -o /tmp/bottled-seasonal-tests
          /tmp/bottled-seasonal-tests
